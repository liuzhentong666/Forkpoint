\* The rules as they are, but an agent may also read main first and fork afterwards, which its
\* login allows: agentdb_worker reads the app tables, and vc.agent_fork(name, vc.head()) forks
\* from the head at that moment.
SPECIFICATION Spec
CONSTANTS
    Agents = {"a", "b"}
    ReadOnBranch = FALSE
    CheckWritten = TRUE
    SharedLogin = TRUE
    Budgets = {3, 4}
    MaxCalls = 2
INVARIANTS
    TypeOK
    MainIsSerial
    WithinBudget
    HeadStaysUnderLock
