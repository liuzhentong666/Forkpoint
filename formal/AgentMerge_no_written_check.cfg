\* Control: merge_validated without its check of the rows a branch wrote, so those rows get only
\* vc.merge's rule. This is the case sql/008_read_set_merge.sql was written against ("else two sales
\* of the last unit both land"), so MainIsSerial must fail here, or the model can't catch it.
SPECIFICATION Spec
CONSTANTS
    Agents = {"a", "b"}
    ReadOnBranch = TRUE
    CheckWritten = FALSE
    SharedLogin = TRUE
    Budgets = {3, 4}
    MaxCalls = 2
INVARIANTS
    TypeOK
    MainIsSerial
    WithinBudget
    HeadStaysUnderLock
