\* The rules as they are, with agents reading on their branch as documented. Every invariant should hold.
\* Budget 4 lets both sales land; budget 3 refuses the second under the lock, after the early check passed.
SPECIFICATION Spec
CONSTANTS
    Agents = {"a", "b"}
    ReadOnBranch = TRUE
    CheckWritten = TRUE
    SharedLogin = TRUE
    Budgets = {3, 4}
    MaxCalls = 2
INVARIANTS
    TypeOK
    MainIsSerial
    WithinBudget
    HeadStaysUnderLock
