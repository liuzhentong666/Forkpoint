\* The rules as they are, with three agents: a merge can then find two others landed since its branch
\* started. Retries are off (MaxCalls = 1) so the run takes minutes, not hours; the two-agent configs
\* check retries. Budget 6 lets all three sales land; budget 5 refuses the third under the lock.
SPECIFICATION Spec
CONSTANTS
    Agents = {"a", "b", "c"}
    ReadOnBranch = TRUE
    CheckWritten = TRUE
    SharedLogin = TRUE
    Budgets = {5, 6}
    MaxCalls = 1
INVARIANTS
    TypeOK
    MainIsSerial
    WithinBudget
    HeadStaysUnderLock
